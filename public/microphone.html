<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micrófono · OrientaT</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #1d2330; --muted: #6b7280; --accent: #f20d0d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14161b; --fg: #f3f4f6; --muted: #9ca3af; --accent: #ff4a33; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 34rem; padding: 32px 16px; text-align: center; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: var(--muted); }
      p.ok { color: var(--fg); font-weight: 600; }
      p.error { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Permite el micrófono</h1>
      <p id="status">Chrome te preguntará si el asistente puede usar el micrófono. Pulsa «Permitir».</p>
    </main>
    <script src="microphone.js"></script>
  </body>
</html>
